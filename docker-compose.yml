version: '3.8'

services:
  db:
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:16
    container_name: person-postgres
    restart: always
    environment:
      POSTGRES_DB: ${Postgres_DbName}
      POSTGRES_USER: ${Postgres_User}
      POSTGRES_PASSWORD: ${Postgres_Password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - person-network

  app:
    build: .
    container_name: person-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_Host}
      DB_PORT: ${Postgres_Port}
      DB_USER: ${Postgres_User}
      DB_PASSWORD: ${Postgres_Password}
      DB_NAME: ${Postgres_DbName}
    networks:
      - person-network

volumes:
  pgdata:

networks:
  person-network:
    driver: bridge